quarkus.application.name=chainbank-api
quarkus.http.port=8080

# Database. In dev/test Quarkus Dev Services starts PostgreSQL automatically when no URL is set.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true

# API docs
quarkus.smallrye-openapi.info-title=ChainBank API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.swagger-ui.always-include=true

# Logging: include correlation id from MDC, never log secrets.
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] [cid=%X{correlationId}] %s%e%n

chainbank.chain.rpc-url=${CHAIN_RPC_URL:http://localhost:8545}

# --- Security (Phase 1) ----------------------------------------------------
# Authenticate lazily, only on endpoints that require it; public endpoints ignore stale cookies.
quarkus.http.auth.proactive=false

chainbank.web.allowed-origins=${WEB_ORIGIN:http://localhost:3000}
chainbank.session.cookie-secure=${SESSION_COOKIE_SECURE:true}
%dev.chainbank.session.cookie-secure=false
%test.chainbank.session.cookie-secure=false

# AES-256 key for TOTP secrets. Prod MUST provide TOTP_KEY; dev/test use a fixed, public key.
chainbank.secrets.totp-key=${TOTP_KEY}
%dev.chainbank.secrets.totp-key=ZGV2LW9ubHktdG90cC1rZXktMzItYnl0ZXMtbG9uZyE=
%test.chainbank.secrets.totp-key=ZGV2LW9ubHktdG90cC1rZXktMzItYnl0ZXMtbG9uZyE=

chainbank.wallet.domain=${WALLET_DOMAIN:localhost:3000}
chainbank.wallet.uri=${WALLET_URI:http://localhost:3000}
chainbank.wallet.allowed-chain-ids=31337

chainbank.rate-limit.per-account=5
chainbank.rate-limit.per-ip=100
# Tests share one client IP across many accounts.
%test.chainbank.rate-limit.per-ip=100000

chainbank.demo.seed=${CHAINBANK_DEMO_SEED:false}
chainbank.demo.password=${CHAINBANK_DEMO_PASSWORD:chainbank-demo-password}
%dev.chainbank.demo.seed=true
