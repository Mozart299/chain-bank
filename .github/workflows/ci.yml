name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Quarkus + PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Dev Services starts PostgreSQL via Docker, which GitHub runners provide.
      - run: ./mvnw -B verify
        working-directory: services/api

  node:
    name: Contracts + Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chainbank/contracts test
      - run: pnpm --filter @chainbank/web lint
      - run: pnpm --filter @chainbank/web typecheck
      - run: pnpm --filter @chainbank/web build

  smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [api, node]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make up
      - run: make smoke
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color
